version: "3.8"

services:
  db:
    image: postgres:15-alpine
    container_name: diligence_db
    environment:
      POSTGRES_USER: copilot
      POSTGRES_PASSWORD: copilot_pass
      POSTGRES_DB: diligence_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U copilot -d diligence_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: diligence_api
    environment:
      DATABASE_URL: sqlite+aiosqlite:///./storage/diligence_copilot.db
      LLM_PROVIDER: mock
      UPLOAD_DIR: ./storage/uploads
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - app_data:/app/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: diligence_worker
    environment:
      DATABASE_URL: sqlite+aiosqlite:///./storage/diligence_copilot.db
      LLM_PROVIDER: mock
      UPLOAD_DIR: ./storage/uploads
    depends_on:
      api:
        condition: service_healthy
      db:
        condition: service_healthy
    restart: always
    volumes:
      - app_data:/app/storage

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: diligence_frontend
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  app_data:
